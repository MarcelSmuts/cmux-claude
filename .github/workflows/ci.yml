name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than using the runner's preinstalled shellcheck: the two drift,
      # and a version bump in the image would fail the build on findings a contributor
      # can't reproduce locally. Bump this deliberately, with the fixes in the same PR.
      - name: Install shellcheck (pinned)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp shellcheck-v0.11.0/shellcheck
          sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      # -x follows sourced files (install/*.sh -> lib/common.sh, claude/scripts/*.sh ->
      # session-lib.sh); .shellcheckrc turns that on and resolves the directives.
      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck -x

      # Advisory only: a non-blocking style signal. We deliberately do NOT reformat
      # the existing scripts to satisfy it, so this must never fail the build.
      - name: shfmt (advisory, non-blocking)
        continue-on-error: true
        run: |
          curl -sSfL "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64" -o /tmp/shfmt
          chmod +x /tmp/shfmt
          /tmp/shfmt -d $(git ls-files '*.sh')

  test:
    name: Tests (syntax sweep + bats)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Retried and time-boxed: the runner's apt mirror intermittently stalls on
      # InRelease, which without a bound hangs the job until the 6h runner limit.
      - name: Install bats and zsh
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y bats zsh && exit 0
            echo "apt attempt $attempt failed; retrying" >&2
            sleep 5
          done
          exit 1

      # Cheap breakage check across the whole tree, in each language's own parser.
      - name: Syntax sweep
        run: |
          git ls-files '*.sh'  | xargs -I{} bash -n {}
          git ls-files '*.zsh' | xargs -I{} zsh -n {}
          git ls-files '*.py'  | xargs -I{} python3 -m py_compile {}

      - name: bats unit tests
        run: bats test/
