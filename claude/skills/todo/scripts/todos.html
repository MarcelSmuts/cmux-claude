<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Todos</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 760px;
    margin: 2.5rem auto;
    padding: 0 1.25rem 4rem;
    line-height: 1.45;
    color: #1a1a1a;
    background: #fbfbfa;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e6e3; background: #191918; }
  }
  h1 { font-size: 1.3rem; margin-bottom: 0.1rem; }
  .path { font-size: 0.78rem; opacity: 0.55; margin-bottom: 1.5rem; word-break: break-all; }
  .bar { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 0.85rem; padding: 0.45rem 0.9rem; border-radius: 6px;
    border: 1px solid rgba(127,127,127,0.35); background: rgba(127,127,127,0.08);
    color: inherit; cursor: pointer;
  }
  button:hover { background: rgba(127,127,127,0.16); }
  button:disabled { opacity: 0.4; cursor: default; }
  .status { font-size: 0.78rem; opacity: 0.6; }
  .error { color: #c0392b; font-size: 0.82rem; margin: 0.5rem 0; }
  @media (prefers-color-scheme: dark) { .error { color: #ff8a75; } }
  .empty { opacity: 0.55; font-size: 0.9rem; padding: 2rem 0; text-align: center; }
  ul.items { list-style: none; padding: 0; margin: 0; }
  li.item {
    display: flex; gap: 0.7rem; align-items: flex-start;
    padding: 0.55rem 0.2rem; border-bottom: 1px solid rgba(127,127,127,0.14);
  }
  li.item input[type=checkbox] { margin-top: 0.2rem; width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
  .item-body { flex: 1; min-width: 0; }
  .item-text { font-size: 0.92rem; }
  .item-text a { color: #3b7dd8; }
  .item-meta { font-size: 0.74rem; opacity: 0.55; margin-top: 0.15rem; }
  .done .item-text { opacity: 0.5; text-decoration: line-through; }
  .item-badges { flex-shrink: 0; display: flex; gap: 0.4rem; align-items: center; margin-top: 0.05rem; }
  .effort-badge {
    font-size: 0.68rem; padding: 0.15rem 0.5rem; border-radius: 999px;
    border: 1px solid rgba(127,127,127,0.35); cursor: pointer; user-select: none;
    opacity: 0.8; white-space: nowrap;
  }
  .effort-badge:hover { opacity: 1; background: rgba(127,127,127,0.14); }
  .stale-badge {
    font-size: 0.68rem; opacity: 0.85; color: #9a6a00; white-space: nowrap;
  }
  @media (prefers-color-scheme: dark) { .stale-badge { color: #e0b34d; } }
  details { margin-top: 1.6rem; }
  summary { cursor: pointer; font-size: 0.85rem; opacity: 0.7; padding: 0.3rem 0; }
  h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.55; margin: 1.6rem 0 0.4rem; }
</style>
</head>
<body>
  <h1>Todos</h1>
  <div class="path" id="path">~/.config/cmux-claude/todos.md</div>
  <div class="bar">
    <button id="refreshBtn">Refresh</button>
    <span class="status" id="status"></span>
  </div>
  <div class="error" id="error" style="display:none"></div>
  <div id="content"></div>

<script>
let lines = [];   // raw file lines, source of truth
let hadTrailingNewline = true;

const EFFORT_ORDER = ['S', 'M', 'L'];
const STALE_DAYS = 7;

const el = {
  refreshBtn: document.getElementById('refreshBtn'),
  status: document.getElementById('status'),
  error: document.getElementById('error'),
  content: document.getElementById('content'),
};

function showError(msg) {
  el.error.textContent = msg;
  el.error.style.display = msg ? 'block' : 'none';
}
function setStatus(msg) { el.status.textContent = msg; }

// --- parsing ---
// "- [ ] text · added 2026-08-11 · effort M · note" / "- [x] text · added ... · effort ... · done ... · note"
function parseLine(line) {
  const m = line.match(/^- \[([ xX])\] (.*)$/);
  if (!m) return null;
  const parts = m[2].split(' · ');
  return { done: m[1].toLowerCase() === 'x', text: parts[0], meta: parts.slice(1) };
}
function buildLine(parsed) {
  const prefix = parsed.done ? '- [x] ' : '- [ ] ';
  return prefix + [parsed.text, ...parsed.meta].join(' · ');
}
function metaValue(meta, prefix) {
  const m = meta.find(x => x.startsWith(prefix));
  return m ? m.slice(prefix.length) : null;
}
function todayLocal() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysSince(dateStr) {
  if (!dateStr) return null;
  const then = new Date(dateStr + 'T00:00:00');
  if (isNaN(then)) return null;
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.round((now - then) / 86400000);
}
function effortRank(meta) {
  const idx = EFFORT_ORDER.indexOf(metaValue(meta, 'effort '));
  return idx === -1 ? EFFORT_ORDER.length : idx;
}
function isStale(parsed) {
  if (parsed.done) return false;
  const d = daysSince(metaValue(parsed.meta, 'added '));
  return d !== null && d > STALE_DAYS;
}
// insert a new tag after 'effort' if present, else after 'added', else at the start —
// keeps the canonical order: added, effort, done, free-text notes
function insertTag(meta, tag) {
  const after = ['effort ', 'added '];
  for (const p of after) {
    const i = meta.findIndex(x => x.startsWith(p));
    if (i >= 0) return [...meta.slice(0, i + 1), tag, ...meta.slice(i + 1)];
  }
  return [tag, ...meta];
}
function toggle(parsed) {
  let meta = parsed.meta.slice();
  if (!parsed.done) {
    meta = insertTag(meta, 'done ' + todayLocal());
  } else {
    meta = meta.filter(x => !x.startsWith('done '));
  }
  return { done: !parsed.done, text: parsed.text, meta };
}
function setEffort(parsed, value) {
  let meta = parsed.meta.slice();
  const i = meta.findIndex(x => x.startsWith('effort '));
  if (i >= 0) meta[i] = 'effort ' + value;
  else meta = insertTag(meta, 'effort ' + value);
  return { done: parsed.done, text: parsed.text, meta };
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function linkLabel(url) {
  try { return new URL(url).hostname.includes('slack.com') ? 'Slack' : 'Source'; }
  catch { return 'Source'; }
}
function linkify(s) {
  return escapeHtml(s).replace(/https?:\/\/\S+/g, (u) => {
    const clean = u.replace(/[),.]+$/, '');
    const trail = u.slice(clean.length);
    return `<a href="${clean}" target="_blank" rel="noopener">${linkLabel(clean)}</a>${trail}`;
  });
}

// --- rendering ---
function render() {
  const open = [];
  const done = [];
  lines.forEach((line, idx) => {
    const parsed = parseLine(line);
    if (!parsed) return;
    (parsed.done ? done : open).push({ idx, parsed });
  });

  if (!open.length && !done.length) {
    el.content.innerHTML = '<div class="empty">No todos found in the file.</div>';
    return;
  }

  open.sort((a, b) => effortRank(a.parsed.meta) - effortRank(b.parsed.meta));
  done.sort((a, b) => effortRank(a.parsed.meta) - effortRank(b.parsed.meta));

  const itemHtml = ({ idx, parsed }) => {
    const effort = metaValue(parsed.meta, 'effort ');
    const stale = isStale(parsed);
    const staleDays = stale ? daysSince(metaValue(parsed.meta, 'added ')) : null;
    return `
    <li class="item ${parsed.done ? 'done' : ''}" data-idx="${idx}">
      <input type="checkbox" ${parsed.done ? 'checked' : ''}>
      <div class="item-body">
        <div class="item-text">${linkify(parsed.text)}</div>
        ${parsed.meta.length ? `<div class="item-meta">${parsed.meta.map(escapeHtml).join(' · ')}</div>` : ''}
      </div>
      <div class="item-badges">
        ${stale ? `<span class="stale-badge">⚠ ${staleDays}d</span>` : ''}
        <span class="effort-badge" data-idx="${idx}" title="click to change">${effort || 'size?'}</span>
      </div>
    </li>`;
  };

  let html = '';
  html += `<h2>Open (${open.length})</h2>`;
  html += open.length
    ? `<ul class="items">${open.map(itemHtml).join('')}</ul>`
    : `<div class="empty">Nothing open 🎉</div>`;

  html += `<details><summary>Done (${done.length})</summary><ul class="items">${done.map(itemHtml).join('')}</ul></details>`;

  el.content.innerHTML = html;
  el.content.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', onToggle);
  });
  el.content.querySelectorAll('.effort-badge').forEach(b => {
    b.addEventListener('click', onEffortClick);
  });
}

async function onToggle(e) {
  const li = e.target.closest('li');
  const idx = Number(li.dataset.idx);
  const parsed = parseLine(lines[idx]);
  lines[idx] = buildLine(toggle(parsed));
  render();
  await save();
}

async function onEffortClick(e) {
  const idx = Number(e.target.dataset.idx);
  const parsed = parseLine(lines[idx]);
  const cur = metaValue(parsed.meta, 'effort ');
  const next = EFFORT_ORDER[(EFFORT_ORDER.indexOf(cur) + 1) % EFFORT_ORDER.length];
  lines[idx] = buildLine(setEffort(parsed, next));
  render();
  await save();
}

// --- server I/O ---
async function loadTodos() {
  try {
    const res = await fetch('/api/todos', { cache: 'no-store' });
    if (!res.ok) throw new Error('server returned ' + res.status);
    const text = await res.text();
    hadTrailingNewline = text.endsWith('\n');
    lines = text.replace(/\n$/, '').split('\n');
    render();
    setStatus('loaded ' + new Date().toLocaleTimeString());
    showError('');
  } catch (err) {
    showError('Failed to load: ' + err.message);
  }
}
async function save() {
  try {
    const text = lines.join('\n') + (hadTrailingNewline ? '\n' : '');
    const res = await fetch('/api/todos', { method: 'POST', body: text });
    if (!res.ok) throw new Error('server returned ' + res.status);
    setStatus('saved ' + new Date().toLocaleTimeString());
    showError('');
  } catch (err) {
    showError('Failed to save: ' + err.message);
  }
}

el.refreshBtn.addEventListener('click', loadTodos);
loadTodos();
</script>
</body>
</html>
