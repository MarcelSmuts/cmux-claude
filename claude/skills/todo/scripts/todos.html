<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Todos</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 760px;
    margin: 2.5rem auto;
    padding: 0 1.25rem 4rem;
    line-height: 1.45;
    color: #1a1a1a;
    background: #fbfbfa;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e6e3; background: #191918; }
  }
  h1 { font-size: 1.3rem; margin-bottom: 0.1rem; }
  .path { font-size: 0.78rem; opacity: 0.55; margin-bottom: 1.5rem; word-break: break-all; }
  .bar { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 0.85rem; padding: 0.45rem 0.9rem; border-radius: 6px;
    border: 1px solid rgba(127,127,127,0.35); background: rgba(127,127,127,0.08);
    color: inherit; cursor: pointer;
  }
  button:hover { background: rgba(127,127,127,0.16); }
  button:disabled { opacity: 0.4; cursor: default; }
  input[type=text] {
    font: inherit; font-size: 0.85rem; padding: 0.45rem 0.7rem; border-radius: 6px;
    border: 1px solid rgba(127,127,127,0.35); background: transparent; color: inherit;
    flex: 1; min-width: 14rem;
  }
  .status { font-size: 0.78rem; opacity: 0.6; }
  .error { color: #c0392b; font-size: 0.82rem; margin: 0.5rem 0; }
  @media (prefers-color-scheme: dark) { .error { color: #ff8a75; } }
  .empty { opacity: 0.55; font-size: 0.9rem; padding: 2rem 0; text-align: center; }
  ul.items { list-style: none; padding: 0; margin: 0; }
  li.item {
    display: flex; gap: 0.7rem; align-items: flex-start;
    padding: 0.55rem 0.2rem; border-bottom: 1px solid rgba(127,127,127,0.14);
  }
  li.item input[type=checkbox] { margin-top: 0.2rem; width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
  .item-body { flex: 1; min-width: 0; }
  .item-text { font-size: 0.92rem; }
  .item-text a { color: #3b7dd8; }
  .item-meta { font-size: 0.74rem; opacity: 0.55; margin-top: 0.15rem; }
  .done .item-text { opacity: 0.5; text-decoration: line-through; }
  .item-badges { flex-shrink: 0; display: flex; gap: 0.4rem; align-items: center; margin-top: 0.05rem; }
  .effort-select {
    font: inherit; font-size: 0.68rem; padding: 0.15rem 0.5rem; border-radius: 999px;
    border: 1px solid rgba(127,127,127,0.35); background: transparent; color: inherit;
    cursor: pointer; opacity: 0.8; white-space: nowrap; appearance: none; text-align: center;
  }
  .effort-select:hover { opacity: 1; background: rgba(127,127,127,0.14); }
  .stale-badge {
    font-size: 0.68rem; opacity: 0.85; color: #9a6a00; white-space: nowrap;
  }
  .due-badge { font-size: 0.68rem; opacity: 0.9; white-space: nowrap; }
  .due-soon { color: #9a6a00; }
  .due-over { color: #c0392b; }
  @media (prefers-color-scheme: dark) {
    .stale-badge, .due-soon { color: #e0b34d; }
    .due-over { color: #ff8a75; }
  }
  details { margin-top: 1.6rem; }
  summary { cursor: pointer; font-size: 0.85rem; opacity: 0.7; padding: 0.3rem 0; }
  h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.55; margin: 1.6rem 0 0.4rem; }
</style>
</head>
<body>
  <h1>Todos</h1>
  <div class="path" id="path">~/.config/cmux-claude/todos.md</div>
  <div class="bar">
    <input type="text" id="addInput" placeholder="Add a todo…" autocomplete="off">
    <button id="addBtn">Add</button>
    <button id="refreshBtn">Refresh</button>
    <span class="status" id="status"></span>
  </div>
  <div class="error" id="error" style="display:none"></div>
  <div id="content"></div>

<script>
let lines = [];   // raw file lines, source of truth
let hadTrailingNewline = true;
let version = null;   // server's hash of the content we last loaded; sent back on save

const EFFORT_ORDER = ['S', 'M', 'L'];
const STALE_DAYS = 7;
const DUE_SOON_DAYS = 3;
const VERSION_HEADER = 'X-Todos-Version';

const el = {
  addInput: document.getElementById('addInput'),
  addBtn: document.getElementById('addBtn'),
  refreshBtn: document.getElementById('refreshBtn'),
  status: document.getElementById('status'),
  error: document.getElementById('error'),
  content: document.getElementById('content'),
};

function showError(msg) {
  el.error.textContent = msg;
  el.error.style.display = msg ? 'block' : 'none';
}
function setStatus(msg) { el.status.textContent = msg; }
function stamp(msg) { setStatus(msg + ' ' + new Date().toLocaleTimeString()); }

// --- parsing ---
// "- [ ] text · added 2026-08-11 · due 2026-08-20 · effort M · note"
function parseLine(line) {
  const m = line.match(/^- \[([ xX])\] (.*)$/);
  if (!m) return null;
  const parts = m[2].split(' · ');
  return { done: m[1].toLowerCase() === 'x', text: parts[0], meta: parts.slice(1) };
}
function buildLine(parsed) {
  const prefix = parsed.done ? '- [x] ' : '- [ ] ';
  return prefix + [parsed.text, ...parsed.meta].join(' · ');
}
function metaValue(meta, prefix) {
  const m = meta.find(x => x.startsWith(prefix));
  return m ? m.slice(prefix.length) : null;
}
function todayLocal() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysSince(dateStr) {
  if (!dateStr) return null;
  const then = new Date(dateStr + 'T00:00:00');
  if (isNaN(then)) return null;
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.round((now - then) / 86400000);
}
function daysUntil(dateStr) {
  const d = daysSince(dateStr);
  return d === null ? null : -d;
}
function effortRank(meta) {
  const idx = EFFORT_ORDER.indexOf(metaValue(meta, 'effort '));
  return idx === -1 ? EFFORT_ORDER.length : idx;
}
function delegatedTo(meta) {
  return metaValue(meta, 'delegated to ');
}
function isStale(parsed) {
  // a due date supersedes the age flag
  if (parsed.done || metaValue(parsed.meta, 'due ')) return false;
  const d = daysSince(metaValue(parsed.meta, 'added '));
  return d !== null && d > STALE_DAYS;
}
// canonical tag order: added, due, effort, done, then free-text notes
const TAG_ORDER = ['added ', 'due ', 'effort ', 'done '];
function tagRank(part) {
  const i = TAG_ORDER.findIndex(p => part.startsWith(p));
  return i === -1 ? TAG_ORDER.length : i;   // free text sorts after every tag
}
function insertTag(meta, tag) {
  const rank = tagRank(tag);
  let at = 0;
  meta.forEach((part, i) => { if (tagRank(part) < rank) at = i + 1; });
  return [...meta.slice(0, at), tag, ...meta.slice(at)];
}
function setDone(parsed, done) {
  let meta = parsed.meta.filter(x => !x.startsWith('done '));
  if (done) meta = insertTag(meta, 'done ' + todayLocal());
  return { done, text: parsed.text, meta };
}
function setEffort(parsed, value) {
  let meta = parsed.meta.filter(x => !x.startsWith('effort '));
  if (value) meta = insertTag(meta, 'effort ' + value);
  return { done: parsed.done, text: parsed.text, meta };
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function linkLabel(url) {
  try { return new URL(url).hostname.includes('slack.com') ? 'Slack' : 'Source'; }
  catch { return 'Source'; }
}
function linkify(s) {
  return escapeHtml(s).replace(/https?:\/\/\S+/g, (u) => {
    const clean = u.replace(/[),.]+$/, '');
    const trail = u.slice(clean.length);
    return `<a href="${clean}" target="_blank" rel="noopener">${linkLabel(clean)}</a>${trail}`;
  });
}

// --- rendering ---
// open items: dated first (most overdue → soonest), then undated by effort
function openSort(a, b) {
  const da = metaValue(a.parsed.meta, 'due '), db = metaValue(b.parsed.meta, 'due ');
  if (da && db) return da < db ? -1 : da > db ? 1 : 0;
  if (da) return -1;
  if (db) return 1;
  return effortRank(a.parsed.meta) - effortRank(b.parsed.meta);
}
function doneSort(a, b) {
  const da = metaValue(a.parsed.meta, 'done ') || '', db = metaValue(b.parsed.meta, 'done ') || '';
  return da < db ? 1 : da > db ? -1 : 0;
}

function render() {
  const open = [];
  const delegated = [];
  const done = [];
  lines.forEach((line, idx) => {
    const parsed = parseLine(line);
    if (!parsed) return;
    if (parsed.done) done.push({ idx, parsed });
    else (delegatedTo(parsed.meta) ? delegated : open).push({ idx, parsed });
  });

  if (!open.length && !delegated.length && !done.length) {
    el.content.innerHTML = '<div class="empty">No todos found in the file.</div>';
    return;
  }

  open.sort(openSort);
  delegated.sort(openSort);
  done.sort(doneSort);

  const itemHtml = ({ idx, parsed }) => {
    const effort = metaValue(parsed.meta, 'effort ');
    const due = metaValue(parsed.meta, 'due ');
    const left = parsed.done ? null : daysUntil(due);
    const dueClass = left === null ? null : left < 0 ? 'due-over' : left <= DUE_SOON_DAYS ? 'due-soon' : null;
    const stale = isStale(parsed);
    const staleDays = stale ? daysSince(metaValue(parsed.meta, 'added ')) : null;
    return `
    <li class="item ${parsed.done ? 'done' : ''}" data-idx="${idx}">
      <input type="checkbox" ${parsed.done ? 'checked' : ''}>
      <div class="item-body">
        <div class="item-text">${linkify(parsed.text)}</div>
        ${parsed.meta.length ? `<div class="item-meta">${parsed.meta.map(escapeHtml).join(' · ')}</div>` : ''}
      </div>
      <div class="item-badges">
        ${dueClass ? `<span class="due-badge ${dueClass}">${left < 0 ? '⏰' : '📅'} ${escapeHtml(due)}</span>` : ''}
        ${stale ? `<span class="stale-badge">⚠ ${staleDays}d</span>` : ''}
        <select class="effort-select" data-idx="${idx}" title="effort">
          <option value=""${effort ? '' : ' selected'}>size?</option>
          ${EFFORT_ORDER.map(e => `<option value="${e}"${e === effort ? ' selected' : ''}>${e}</option>`).join('')}
        </select>
      </div>
    </li>`;
  };

  let html = '';
  html += `<h2>Open (${open.length})</h2>`;
  html += open.length
    ? `<ul class="items">${open.map(itemHtml).join('')}</ul>`
    : `<div class="empty">Nothing open 🎉</div>`;

  if (delegated.length) {
    html += `<h2>Delegated / chasing (${delegated.length})</h2>`;
    html += `<ul class="items">${delegated.map(itemHtml).join('')}</ul>`;
  }

  html += `<details><summary>Done (${done.length})</summary><ul class="items">${done.map(itemHtml).join('')}</ul></details>`;

  el.content.innerHTML = html;
  el.content.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', onToggle);
  });
  el.content.querySelectorAll('.effort-select').forEach(s => {
    s.addEventListener('change', onEffortChange);
  });
}

// --- edits ---
// An edit is an intent, not a line index: after a 409 the file has been re-read and the
// indices have moved, so the intent is re-applied by matching the item's text.
function findByText(text) {
  return lines.findIndex(l => { const p = parseLine(l); return p && p.text === text; });
}
function applyIntent(intent) {
  if (intent.insert !== undefined) {
    if (findByText(intent.text) >= 0) return true;   // already there — someone else added it
    const at = lines.findIndex(l => parseLine(l));
    if (at >= 0) lines.splice(at, 0, intent.insert);
    else lines.push(intent.insert);
    return true;
  }
  const idx = findByText(intent.text);
  if (idx < 0) return false;
  lines[idx] = buildLine(intent.apply(parseLine(lines[idx])));
  return true;
}

async function commit(intent) {
  if (!applyIntent(intent)) { showError('That item is no longer in the file.'); return; }
  render();
  if (await save() !== 'conflict') return;

  setStatus('file changed on disk — re-applying…');
  if (!await loadTodos({ quiet: true })) return;
  if (!applyIntent(intent)) {
    render();
    showError('The file changed on disk and that item is gone — your change was not saved.');
    return;
  }
  render();
  const result = await save();
  if (result === 'conflict') showError('The file keeps changing underneath — refresh and try again.');
  else if (result) stamp('merged with a change on disk, saved');
}

async function onToggle(e) {
  const parsed = parseLine(lines[Number(e.target.closest('li').dataset.idx)]);
  const done = !parsed.done;
  await commit({ text: parsed.text, apply: p => setDone(p, done) });
}

async function onEffortChange(e) {
  const parsed = parseLine(lines[Number(e.target.dataset.idx)]);
  const next = e.target.value || null;   // "" is the unset option
  await commit({ text: parsed.text, apply: p => setEffort(p, next) });
}

async function onAdd() {
  const text = el.addInput.value.trim();
  if (!text) return;
  el.addInput.value = '';
  // no effort tag: the next recap run estimates it, or the user clicks the "size?" badge
  await commit({ text, insert: `- [ ] ${text} · added ${todayLocal()}` });
}

// --- server I/O ---
async function loadTodos(opts = {}) {
  try {
    const res = await fetch('/api/todos', { cache: 'no-store' });
    if (!res.ok) throw new Error('server returned ' + res.status);
    const text = await res.text();
    version = res.headers.get(VERSION_HEADER);
    hadTrailingNewline = text.endsWith('\n');
    lines = text.replace(/\n$/, '').split('\n');
    render();
    if (!opts.quiet) { stamp('loaded'); showError(''); }
    return true;
  } catch (err) {
    showError('Failed to load: ' + err.message);
    return false;
  }
}
// true on success, 'conflict' when the file moved under us, false on any other failure
async function save() {
  try {
    const text = lines.join('\n') + (hadTrailingNewline ? '\n' : '');
    const res = await fetch('/api/todos', {
      method: 'POST',
      headers: { [VERSION_HEADER]: version || '' },
      body: text,
    });
    if (res.status === 409) return 'conflict';
    if (!res.ok) throw new Error('server returned ' + res.status);
    version = res.headers.get(VERSION_HEADER);
    stamp('saved');
    showError('');
    return true;
  } catch (err) {
    showError('Failed to save: ' + err.message);
    return false;
  }
}

el.refreshBtn.addEventListener('click', () => loadTodos());
el.addBtn.addEventListener('click', onAdd);
el.addInput.addEventListener('keydown', e => { if (e.key === 'Enter') onAdd(); });
// a tab left open all day would otherwise show a stale list
window.addEventListener('focus', () => loadTodos({ quiet: true }));
loadTodos();
</script>
</body>
</html>
